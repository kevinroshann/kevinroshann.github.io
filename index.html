<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #64ffda;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.5;
            padding: 0 20px;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 24px 0; }

        h1, h2, h3 { color: var(--text-main); font-weight: 700; }
        h1 { font-size: 2rem; letter-spacing: -0.5px; margin-bottom: 0.25rem; }
        h2 { font-size: 1.3rem; margin-bottom: 1rem; color: var(--accent); display: flex; align-items: center; }
        h2::after { content: ""; display: block; height: 1px; background: #333; flex: 1; margin-left: 15px; }

        p { margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.95rem; }
        a { text-decoration: none; color: inherit; transition: 0.2s; }

        /* --- Header --- */
        header { margin-bottom: 28px; animation: fadeIn 0.8s ease-in; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        .tagline { font-size: 1rem; color: var(--text-muted); margin-bottom: 8px; }
        .social-links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        /* Unified link styling for all header pills */
        .social-links a {
            display: inline-flex; align-items: center; gap: 6px; color: var(--text-main);
            font-size: 0.85rem; padding: 4px 12px; background: var(--card-bg);
            border-radius: 50px; border: 1px solid transparent;
        }
        .social-links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* --- Sections --- */
        section { margin-bottom: 32px; animation: slideUp 0.8s ease-out; }

        /* Experience */
        .job-item { margin-bottom: 20px; padding-left: 16px; border-left: 2px solid #333; transition: border-color 0.3s; }
        .job-item:hover { border-left-color: var(--accent); }
        .job-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
        .job-title { font-weight: 600; font-size: 1rem; color: var(--text-main); }
        .company { color: var(--accent); }
        .date { font-size: 0.8rem; font-family: monospace; color: var(--text-muted); }

        /* Projects (List View) */
        .project-list { display: flex; flex-direction: column; }
        .project-item { padding: 16px 0; border-bottom: 1px solid #333; transition: transform 0.2s; display: block; }
        .project-item:last-child { border-bottom: none; }
        .project-item:hover { transform: translateX(8px); }
        .project-title {
            font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;
            display: flex; justify-content: space-between; align-items: center;
            color: var(--text-main);
        }
        .project-item:hover .project-title { color: var(--accent); }
        .tech-stack { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .tech-tag {
            font-size: 0.75rem; font-family: monospace; color: var(--text-muted);
            background: transparent; padding: 0;
        }
        .tech-tag::before { content: "#"; color: var(--accent); margin-right: 2px; }

        footer { text-align: center; padding-bottom: 20px; font-size: 0.8rem; color: #555; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            .container { padding: 16px 0; }
            .job-header { flex-direction: column; gap: 2px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header id="header-section">
        <!-- Content injected by JS -->
    </header>

    <!-- EXPERIENCE -->
    <section>
        <h2>Where I've Worked</h2>
        <div id="experience-list">
            <!-- Content injected by JS -->
        </div>
    </section>

    <!-- PROJECTS -->
    <section>
        <h2>What I've Built</h2>
        <div id="project-list" class="project-list">
             <!-- Content injected by JS -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p id="footer-text"></p>
    </footer>

</div>

<script src="data.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Set Meta Title
        document.title = data.meta.title;

        // 2. Compact Render Header with Resume & Filtered Social Links
        const aboutText = data.about ? data.about.join(' ') : data.header.intro;
        const resumeUrl = "https://drive.google.com/file/d/1v4Q-NYCIqYw6gUA4kht9hPA4Rt8yqezb/view?usp=drive_link";
        const emailAddress = "mailto:kevinroshan17@gmail.com";

        // Filter out any existing 'Email' or 'Mail' entries from data.header.social so there are no duplicates on the right side
        const filteredSocials = data.header.social.filter(s =>
            !['email', 'mail'].includes(s.name.toLowerCase())
        );

        const headerHTML = `
            <div class="header-top">
                <h1>${data.header.name}</h1>
                <div class="social-links">
                    <a href="${resumeUrl}" target="_blank" rel="noopener noreferrer" title="View Resume">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        Resume
                    </a>
                    <a href="${emailAddress}" title="Send Email">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0l-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"/></svg>
                        Email
                    </a>
                    ${filteredSocials.map(s => `
                        <a href="${s.link}" target="_blank">
                            <svg class="icon" viewBox="0 0 24 24"><path d="${s.iconPath}"/></svg>
                            ${s.name}
                        </a>
                    `).join('')}
                </div>
            </div>
            <p class="tagline">${data.header.tagline}</p>
            <p>${aboutText}</p>
        `;
        document.getElementById('header-section').innerHTML = headerHTML;

        // 3. Render Experience
        const experienceHTML = data.experience.map(job => `
            <div class="job-item">
                <div class="job-header">
                    <span class="job-title">${job.title} <span class="company">@ ${job.company}</span></span>
                    <span class="date">${job.date}</span>
                </div>
                <p>${job.description}</p>
            </div>
        `).join('');
        document.getElementById('experience-list').innerHTML = experienceHTML;

        // 4. Render Projects
        const projectsHTML = data.projects.map(proj => `
            <a href="${proj.link}" class="project-item">
                <div class="project-title">
                    <span>${proj.title}</span>
                    <svg class="icon" style="transform: rotate(-45deg)" viewBox="0 0 24 24"><path d="M14 13v6h-4v-6h-5l7-7 7 7h-5z"/></svg>
                </div>
                <p>${proj.description}</p>
                <div class="tech-stack">
                    ${proj.tech.map(t => `<span class="tech-tag">${t}</span>`).join('')}
                </div>
            </a>
        `).join('');
        document.getElementById('project-list').innerHTML = projectsHTML;

        // 5. Render Footer
        document.getElementById('footer-text').textContent = data.footer;
    });
</script>

</body>
</html>
